name: kata5-load-balancer

services:
  consul:
    image: hashicorp/consul:2.1.0
    command: agent -dev -client=0.0.0.0 -recursor=127.0.0.11
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "operator", "raft", "list-peers"]
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:stable
    depends_on:
      - consul
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - "./webservice.conf:/etc/nginx/conf.d/default.conf:ro"
